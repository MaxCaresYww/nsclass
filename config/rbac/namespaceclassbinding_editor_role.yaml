# This rule is not used by the project nsclass itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the akuity.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: nsclass
    app.kubernetes.io/managed-by: kustomize
  name: namespaceclassbinding-editor-role
rules:
- apiGroups:
  - akuity.io
  resources:
  - namespaceclassbindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - akuity.io
  resources:
  - namespaceclassbindings/status
  verbs:
  - get
